<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF0091; text-decoration: none; }
    .phone {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: #FFFFFF; color: #111111;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
    }

    /* Header */
    .header { flex-shrink: 0; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.06); z-index: 5; }
    .logo-chip { display: flex; align-items: center; justify-content: center; background: #FF0091; padding: 7px 13px; border-radius: 0; }
    .logo-chip-text { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.4px; color: #FFFFFF; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .menu-btn { width: 36px; height: 36px; border-radius: 12px; background: #F5F5F7; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .account-avatar-btn { width: 36px; height: 36px; border-radius: 50%; background: #FF0091; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .account-avatar-text { color: #FFFFFF; font-weight: 800; font-size: 13px; }

    .scroll { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; }

    /* Full-screen unlock map */
    .map-full { position: relative; width: 100%; height: 360px; flex-shrink: 0; overflow: hidden; }
    .map-full svg { display: block; }
    .map-head-row { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
    .map-live-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 10px 6px 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .map-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #1BB864; animation: live-pulse 1.6s ease-in-out infinite; }
    @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .map-live-text { font-size: 9.5px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; color: #111111; }
    .map-controls { position: absolute; top: 60px; right: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
    .map-ctrl-btn { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.95); box-shadow: 0 4px 10px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; }
    .you-ring { animation: you-ring-pulse 2.2s ease-out infinite; transform-origin: center; }
    @keyframes you-ring-pulse { 0% { r: 6; opacity: 0.5; } 100% { r: 22; opacity: 0; } }
    .pin-label { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 9px; fill: #111111; }
    .pin-eta { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 7.5px; fill: #7E7E87; }

    .unlock-bar { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(17,17,17,0.9); backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 8px 8px 16px; box-shadow: 0 12px 26px rgba(0,0,0,0.28); }
    .unlock-info { display: flex; flex-direction: column; gap: 1px; }
    .unlock-branch { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 12.5px; color: #FFFFFF; }
    .unlock-meta { font-size: 10px; color: rgba(255,255,255,0.6); }
    .unlock-btn { display: flex; align-items: center; gap: 6px; background: #FF0091; color: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12.5px; padding: 10px 16px; border-radius: 999px; flex-shrink: 0; }

    /* My Gym section */
    .mygym-wrap { padding: 20px 20px 34px 20px; display: flex; flex-direction: column; gap: 14px; }
    .section-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.3px; margin: 0; }
    .section-sub { font-size: 12px; color: #7E7E87; margin: 4px 0 2px 0; }

    .visit-col { display: flex; flex-direction: column; gap: 10px; }
    .visit-card { background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 4px 16px rgba(0,0,0,0.04); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; }
    .visit-mark { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,0,145,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .visit-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .visit-name { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 13.5px; margin: 0; }
    .visit-meta { font-size: 11px; color: #7E7E87; }
    .visit-chevron { flex-shrink: 0; }
  </style>
</helmet>

<div class="phone">
  <div class="header">
    <div class="logo-chip"><span class="logo-chip-text">HUMF</span></div>
    <div class="header-actions">
      <div class="menu-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="account-avatar-btn"><span class="account-avatar-text">K</span></div>
    </div>
  </div>

  <div class="scroll">
    <div class="map-full">
      <div class="map-head-row">
        <div class="map-live-badge"><div class="map-live-dot"></div><span class="map-live-text">Live · near you</span></div>
      </div>
      <svg width="390" height="360" viewBox="0 0 390 360" preserveAspectRatio="xMidYMid slice">
        <rect width="390" height="360" fill="#EAEAE2"/>
        <rect x="260" y="20" width="120" height="130" rx="10" fill="#DCE9DC"/>
        <rect x="10" y="230" width="100" height="100" rx="10" fill="#D8E6F2"/>
        <path d="M0 120 C 100 90, 200 170, 390 110" stroke="#FFFFFF" stroke-width="11" fill="none"/>
        <path d="M0 240 C 130 270, 260 190, 390 250" stroke="#FFFFFF" stroke-width="8" fill="none"/>
        <path d="M140 0 L170 360" stroke="#FFFFFF" stroke-width="7" fill="none"/>
        <path d="M285 0 L260 360" stroke="#FFFFFF" stroke-width="6" fill="none"/>

        <g>
          <circle cx="118" cy="160" r="8" fill="#FF0091"/>
          <circle cx="118" cy="160" r="3.4" fill="#FFFFFF"/>
          <text x="118" y="142" text-anchor="middle" class="pin-label">Thonglor</text>
          <text x="118" y="184" text-anchor="middle" class="pin-eta">0.8 km</text>
        </g>
        <g>
          <circle cx="215" cy="95" r="8" fill="#FF0091"/>
          <circle cx="215" cy="95" r="3.4" fill="#FFFFFF"/>
          <text x="215" y="77" text-anchor="middle" class="pin-label">Ari</text>
          <text x="215" y="119" text-anchor="middle" class="pin-eta">1.4 km</text>
        </g>
        <g>
          <circle cx="305" cy="200" r="8" fill="#FF0091"/>
          <circle cx="305" cy="200" r="3.4" fill="#FFFFFF"/>
          <text x="305" y="182" text-anchor="middle" class="pin-label">Siam</text>
          <text x="305" y="224" text-anchor="middle" class="pin-eta">2.6 km</text>
        </g>

        <circle class="you-ring" cx="170" cy="255" r="6" fill="none" stroke="#111111" stroke-width="2"/>
        <circle cx="170" cy="255" r="8" fill="#111111"/>
        <circle cx="170" cy="255" r="3.4" fill="#FFFFFF"/>
      </svg>
      <div class="map-controls">
        <div class="map-ctrl-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="#111111" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="map-ctrl-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#111111" stroke-width="2" stroke-linecap="round"/></svg></div>
      </div>
      <div class="unlock-bar">
        <div class="unlock-info">
          <span class="unlock-branch">HUMF Thonglor</span>
          <span class="unlock-meta">Nearest · 0.8 km away</span>
        </div>
        <div class="unlock-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="#FFFFFF" stroke-width="1.8"/><path d="M8 11V7.5a4 4 0 0 1 6.6-3" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
          Unlock
        </div>
      </div>
    </div>

    <div class="mygym-wrap">
      <div>
        <h2 class="section-title">My Gym</h2>
        <p class="section-sub">Branches you've visited recently.</p>
      </div>
      <div class="visit-col">
        <div class="visit-card">
          <div class="visit-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="#FF0091" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="#FF0091" stroke-width="1.7"/></svg></div>
          <div class="visit-body">
            <p class="visit-name">HUMF Thonglor</p>
            <span class="visit-meta">Visited today · 7:12 AM</span>
          </div>
          <svg class="visit-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="#C7C7CE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="visit-card">
          <div class="visit-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="#FF0091" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="#FF0091" stroke-width="1.7"/></svg></div>
          <div class="visit-body">
            <p class="visit-name">HUMF Ari</p>
            <span class="visit-meta">Visited 3 days ago</span>
          </div>
          <svg class="visit-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="#C7C7CE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="visit-card">
          <div class="visit-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="#FF0091" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="#FF0091" stroke-width="1.7"/></svg></div>
          <div class="visit-body">
            <p class="visit-name">HUMF Siam</p>
            <span class="visit-meta">Visited last week</span>
          </div>
          <svg class="visit-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="#C7C7CE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
