<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .phone {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: #FFFFFF;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .blur-blob { position: absolute; border-radius: 50%; filter: blur(70px); }
    .blob-a { width: 320px; height: 320px; background: rgba(255,0,145,0.22); top: -100px; left: -90px; }
    .blob-b { width: 280px; height: 280px; background: rgba(255,0,145,0.14); bottom: -110px; right: -80px; }
    .blob-c { width: 220px; height: 220px; background: rgba(0,0,0,0.05); top: 40%; left: 55%; transform: translate(-50%, -50%); }

    .load-mark {
      position: relative; width: 56px; height: 56px; border-radius: 0; background: #FF0091;
      overflow: hidden; box-shadow: 0 16px 36px rgba(255,0,145,0.35);
      animation: mark-breathe 2.4s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes mark-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .load-mark::before {
      content: ''; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.5) 45%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0.5) 55%, transparent 100%);
      transform: skewX(-18deg);
      animation: mark-roll 1.7s ease-in-out infinite;
    }
    @keyframes mark-roll { 0% { left: -70%; } 60% { left: 130%; } 100% { left: 130%; } }
  </style>
</helmet>

<div class="phone">
  <div class="blur-blob blob-a"></div>
  <div class="blur-blob blob-b"></div>
  <div class="blur-blob blob-c"></div>
  <div class="load-mark"></div>
</div>
</x-dc>
</body>
</html>
