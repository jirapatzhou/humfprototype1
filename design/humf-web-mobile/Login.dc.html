<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF0091; text-decoration: none; }
    .phone {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: #FFFFFF; color: #111111;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
    }
    .brand-band { flex-shrink: 0; background: #FF0091; padding: 26px 24px 22px 24px; display: flex; flex-direction: column; gap: 10px; }
    .brand-lockup { display: flex; align-items: center; gap: 9px; }
    .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-word { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 16px; color: #FFFFFF; }
    .brand-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.25; color: #FFFFFF; margin: 4px 0 0 0; letter-spacing: -0.3px; }
    .brand-sub { font-size: 12px; color: rgba(255,255,255,0.82); line-height: 1.5; margin: 0; }

    .scroll { flex: 1 1 auto; overflow-y: auto; padding: 26px 24px 40px 24px; display: flex; flex-direction: column; gap: 22px; }
    .form-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 21px; margin: 0; }
    .field-group { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11.5px; font-weight: 700; }
    .field-input { font-size: 13px; color: #7E7E87; background: #F5F5F7; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 13px 14px; }
    .field-row { display: flex; align-items: center; justify-content: space-between; }
    .forgot-link { font-size: 11.5px; font-weight: 700; }
    .btn-obsidian { font-size: 13.5px; font-weight: 700; color: #FFFFFF; background: #111111; padding: 14px; border-radius: 999px; text-align: center; }
    .divider-row { display: flex; align-items: center; gap: 10px; }
    .divider-line { flex: 1 1 auto; height: 1px; background: rgba(0,0,0,0.08); }
    .divider-text { font-size: 10.5px; color: #B4B4BC; font-weight: 700; text-transform: uppercase; }
    .switch-row { text-align: center; font-size: 12.5px; color: #7E7E87; }
    .switch-link { font-weight: 700; }
  </style>
</helmet>

<div class="phone">
  <div class="brand-band">
    <div class="brand-lockup">
      <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m12 2 2.4 7.2H21l-5.8 4.3 2.2 7.1L12 16.2 6.6 20.6l2.2-7.1L3 9.2h6.6Z" fill="#FF0091"/></svg></div>
      <span class="brand-word">HUMF</span>
    </div>
    <p class="brand-title">Your gym, your city, one account.</p>
    <p class="brand-sub">Book slots, unlock doors, manage your membership.</p>
  </div>

  <div class="scroll">
    <h1 class="form-title">Log in to HUMF</h1>
    <div class="field-group">
      <div class="field">
        <span class="field-label">Email or phone</span>
        <div class="field-input">you@email.com</div>
      </div>
      <div class="field">
        <span class="field-label">Password</span>
        <div class="field-input">••••••••••</div>
      </div>
      <div class="field-row">
        <span></span>
        <a class="forgot-link">Forgot password?</a>
      </div>
    </div>
    <div class="btn-obsidian">Log In</div>
    <div class="divider-row"><div class="divider-line"></div><span class="divider-text">or</span><div class="divider-line"></div></div>
    <p class="switch-row">New to HUMF? <a class="switch-link">Create an account</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
