<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF0091; text-decoration: none; }
    .phone {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: #FFFFFF; color: #111111;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .mail-badge { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,0,145,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .head-block { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .verify-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 21px; margin: 0; }
    .verify-sub { font-size: 12.5px; color: #7E7E87; line-height: 1.55; margin: 0; max-width: 300px; }
    .verify-email { font-weight: 700; color: #111111; }
    .otp-row { display: flex; gap: 8px; }
    .otp-box {
      width: 42px; height: 52px; border-radius: 13px; background: #F5F5F7; border: 1.5px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: center; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px;
    }
    .otp-box.filled, .otp-box.cursor { border-color: #FF0091; box-shadow: 0 0 0 3px rgba(255,0,145,0.1); }
    .btn-obsidian { width: 100%; font-size: 13.5px; font-weight: 700; color: #FFFFFF; background: #111111; padding: 14px; border-radius: 999px; text-align: center; }
    .resend-row { font-size: 12px; color: #7E7E87; text-align: center; }
    .resend-link { font-weight: 700; }
    .back-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: #7E7E87; }
  </style>
</helmet>

<div class="phone">
  <div class="card">
    <div class="mail-badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="#FF0091" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="#FF0091" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="head-block">
      <h1 class="verify-title">Verify your email</h1>
      <p class="verify-sub">We sent a 6-digit code to <span class="verify-email">nara.suk@email.com</span>.</p>
    </div>
    <div class="otp-row">
      <div class="otp-box filled">4</div>
      <div class="otp-box filled">2</div>
      <div class="otp-box filled">9</div>
      <div class="otp-box cursor">7</div>
      <div class="otp-box"></div>
      <div class="otp-box"></div>
    </div>
    <div class="btn-obsidian">Confirm Code</div>
    <div class="resend-row">Didn't get it? <a class="resend-link">Resend code</a> · 04:32</div>
    <div class="back-row">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0 6-6m-6 6 6 6" stroke="#7E7E87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to sign up
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
