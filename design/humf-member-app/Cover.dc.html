<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .stage {
      width: 900px; height: 560px; position: relative; overflow: hidden;
      background: #FFFFFF;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .content { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .wordmark {
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 800; font-size: 132px; line-height: 1; color: #FF0091;
      letter-spacing: -2px; margin: 0;
    }
    .tagline {
      font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
      color: #7E7E87; font-weight: 700; margin: 0;
      display: flex; gap: 10px;
    }
    .tagline span:not(:last-child)::after { content: '·'; margin-left: 10px; color: #C7C7CE; }
  </style>
</helmet>
<div class="stage">
  <div class="content">
    <h1 class="wordmark">HUMF</h1>
    <p class="tagline"><span>Humanity</span><span>Ultimate</span><span>Mastery</span><span>Fitness</span></p>
  </div>
</div>
</x-dc>
</body>
</html>
