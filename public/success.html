<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're In — HUMF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23FF0091'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #FF0091; text-decoration: none; }
  .page {
    width: 100%; min-height: 100vh; position: relative; overflow: hidden;
    background: #FF0091; color: #FFFFFF;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .glow-a { position: absolute; width: 620px; height: 620px; border-radius: 50%; background: rgba(255,255,255,0.08); top: -220px; left: -180px; }
  .glow-b { position: absolute; width: 460px; height: 460px; border-radius: 50%; background: rgba(255,255,255,0.06); bottom: -180px; right: -120px; }

  .card {
    position: relative; width: 460px; background: #FFFFFF; border-radius: 28px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.25); padding: 52px 44px; display: flex; flex-direction: column; align-items: center; gap: 22px;
    color: #111111;
  }
  .check-ring {
    width: 84px; height: 84px; border-radius: 50%; background: rgba(255,0,145,0.1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .check-fill {
    width: 60px; height: 60px; border-radius: 50%; background: #FF0091;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .head-block { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .success-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 25px; margin: 0; letter-spacing: -0.4px; }
  .success-sub { font-size: 13.5px; color: #7E7E87; line-height: 1.6; margin: 0; max-width: 340px; }
  .success-name { font-weight: 700; color: #FF0091; }

  .mini-card { width: 100%; background: #F5F5F7; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .mini-avatar { width: 38px; height: 38px; border-radius: 50%; background: #FF0091; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mini-avatar-text { color: #FFFFFF; font-weight: 800; font-size: 14px; }
  .mini-info { display: flex; flex-direction: column; gap: 2px; }
  .mini-name { font-size: 13.5px; font-weight: 700; }
  .mini-meta { font-size: 11.5px; color: #7E7E87; }

  .btn-obsidian {
    width: 100%; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #111111; padding: 14px; border-radius: 999px;
    text-align: center; display: block;
    transition: transform 300ms cubic-bezier(0.16,1,0.3,1), opacity 300ms cubic-bezier(0.16,1,0.3,1);
  }
  .btn-obsidian:hover { transform: scale(1.02); opacity: 0.9; }
  .btn-obsidian:active { transform: scale(0.96); }
  .btn-ghost {
    width: 100%; font-size: 13.5px; font-weight: 700; color: #111111; padding: 12px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12); text-align: center; display: block;
    transition: transform 300ms cubic-bezier(0.16,1,0.3,1), background 300ms cubic-bezier(0.16,1,0.3,1);
  }
  .btn-ghost:hover { transform: scale(1.02); background: #F5F5F7; }
  .btn-ghost:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="page">
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="card">
    <div class="check-ring">
      <div class="check-fill">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="m5 13 5 5L19 7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="head-block">
      <h1 class="success-title">You're in!</h1>
      <p class="success-sub">Welcome back, <span class="success-name">Kaiqing</span>. Your account is verified and ready — every branch, one login.</p>
    </div>

    <div class="mini-card">
      <div class="mini-avatar"><span class="mini-avatar-text">K</span></div>
      <div class="mini-info">
        <span class="mini-name">Kaiqing</span>
        <span class="mini-meta">Logged in · HUMF Membership</span>
      </div>
    </div>

    <a class="btn-obsidian" href="/home.html">Go to Home</a>
    <a class="btn-ghost" href="/account.html">View My Account</a>
  </div>
</div>
</body>
</html>
