<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Email — HUMF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23FF0091'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #FF0091; text-decoration: none; } a:hover { color: #C4006F; }
  .page {
    width: 100%; min-height: 100vh; position: relative;
    background: #F5F5F7; color: #111111;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 460px; background: #FFFFFF; border-radius: 28px; border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 30px 70px rgba(0,0,0,0.08); padding: 48px 44px; display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .mail-badge {
    width: 68px; height: 68px; border-radius: 50%; background: rgba(255,0,145,0.1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .head-block { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .verify-title { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 24px; margin: 0; letter-spacing: -0.4px; }
  .verify-sub { font-size: 13.5px; color: #7E7E87; line-height: 1.6; margin: 0; max-width: 340px; }
  .verify-email { font-weight: 700; color: #111111; }

  .otp-row { display: flex; gap: 10px; }
  .otp-box {
    width: 52px; height: 60px; border-radius: 14px; background: #F5F5F7; border: 1.5px solid rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 24px; color: #111111;
    transition: border-color 300ms cubic-bezier(0.16,1,0.3,1), box-shadow 300ms cubic-bezier(0.16,1,0.3,1);
  }
  .otp-box.filled { border-color: #FF0091; box-shadow: 0 0 0 3px rgba(255,0,145,0.1); }
  .otp-box.cursor { border-color: #FF0091; box-shadow: 0 0 0 3px rgba(255,0,145,0.1); }

  .btn-obsidian {
    width: 100%; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #111111; padding: 14px; border-radius: 999px;
    text-align: center; border: none; cursor: pointer; display: block;
    transition: transform 300ms cubic-bezier(0.16,1,0.3,1), opacity 300ms cubic-bezier(0.16,1,0.3,1);
  }
  .btn-obsidian:hover { transform: scale(1.02); opacity: 0.9; }
  .btn-obsidian:active { transform: scale(0.96); }

  .resend-row { font-size: 13px; color: #7E7E87; text-align: center; }
  .resend-link { font-weight: 700; }
  .back-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #7E7E87; cursor: pointer; }
  .back-row:hover { color: #111111; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="mail-badge">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="#FF0091" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="#FF0091" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="head-block">
      <h1 class="verify-title">Verify your email</h1>
      <p class="verify-sub">We sent a 6-digit code to <span class="verify-email">nara.suk@email.com</span>. Enter it below to confirm your account.</p>
    </div>

    <div class="otp-row">
      <div class="otp-box filled">4</div>
      <div class="otp-box filled">2</div>
      <div class="otp-box filled">9</div>
      <div class="otp-box cursor">7</div>
      <div class="otp-box"></div>
      <div class="otp-box"></div>
    </div>

    <a class="btn-obsidian" href="/success.html">Confirm Code</a>

    <div class="resend-row">Didn't get it? <a class="resend-link" href="#">Resend code</a> · expires in 04:32</div>
    <a class="back-row" href="/signup.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0 6-6m-6 6 6 6" stroke="#7E7E87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to sign up
    </a>
  </div>
</div>
</body>
</html>
